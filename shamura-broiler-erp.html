  address: 'Plot 12, Farm Road', phone: '+91 98765 43210', email: 'accounts@shamurabroiler.in', gst: '33AAKFG1234M1Z8', ownerName: 'Surya & Rathina Sabapathi',
  invoicePrefix: 'INV-', nextInvoiceNo: 1, dueDays: 7, currencySymbol: '₹', currencyCode: 'INR',
  defaultRate: 120, weightUnit: 'kg', quantityUnit: 'Birds', monthlyTarget: 2500000, readyAge: 35,
  fuelTypes: ['Diesel', 'Petrol'], fuelPrices: { Diesel: 92.5, Petrol: 101.2 },
  bankName: 'State Bank of India', accountName: 'Shamura Broiler Service', accountNo: '40123456789', ifsc: 'SBIN0001234', upiId: 'shamurabroiler@sbi',
  terms: 'Goods once delivered will not be taken back. Please verify bird count and weight at the time of delivery.',
  notes: 'Payment is due within the credit period. Thank you for your business.',
  signatory: 'Surya & Rathina Sabapathi', signatoryTitle: 'Partners', showQr: true
};
const EXPENSE_CATEGORIES = ['Chicken Feed', 'Fuel', 'Vehicle Maintenance', 'Driver Salary', 'Employee Salary', 'Farm Maintenance', 'Electricity', 'Labour Charges', 'Transportation', 'Other Expenses'];
const PAY_METHODS = ['Cash', 'UPI', 'Bank Transfer', 'Other'];
const FEED_CATEGORIES = ['Pre-Starter', 'Starter', 'Grower', 'Finisher', 'Supplement'];

const Biz = {
  clock: null,
  s() { return Object.assign({}, DEFAULT_SETTINGS, Store.settings()); },
  now() { return Biz.clock ?? Date.now(); },
  log(text, icon = 'activity', color = 'primary') {
    const l = Store.list('activity_log');
    l.push({ id: U.uid(), ts: Biz.now(), text, icon, color });
    if (l.length > 250) l.splice(0, l.length - 250);
    Store.save('activity_log');
  },
  code(key, prefix, field, width = 4) {
    let max = 0;
    for (const r of Store.list(key)) { const n = parseInt(String(r[field] || '').replace(/\D+/g, ''), 10); if (n > max) max = n; }
    return prefix + U.pad(max + 1, width);
  },
  int(v, label, { min = 1 } = {}) { const n = Number(v); if (!Number.isFinite(n) || Math.floor(n) !== n || n < min) throw new Error(`${label} must be a whole number${min > 0 ? ' greater than zero' : ''}.`); return n; },
  pos(v, label, { allowZero = false } = {}) { const n = Number(v); if (!Number.isFinite(n) || n < 0 || (!allowZero && n === 0)) throw new Error(`${label} must be ${allowZero ? 'zero or more' : 'greater than zero'}.`); return n; },
  need(v, label) { if (v === undefined || v === null || String(v).trim() === '') throw new Error(label + ' is required.'); return String(v).trim(); },

  /* ---------- Farm batches ---------- */
  batch(id) { return Store.get('farm_batches', id); },
  batchAge(b) { return Math.max(0, U.diffDays(U.today(), b.arrivalDate)); },
  batchStage(b) { if (b.status === 'Closed') return 'Closed'; return Biz.batchAge(b) >= Biz.s().readyAge ? 'Ready for Sale' : 'Growing'; },
  activeBatches() { return Store.list('farm_batches').filter(b => b.status !== 'Closed'); },
  move({ date, batchId, type, qty, effect, ref = '', refType = '', notes = '' }) {
    return Store.insert('chicken_stock', { date, batchId, type, qty: Math.abs(qty), effect, ref, refType, notes });
  },
  setStock(b, delta) { const n = b.currentQty + delta; if (n < 0) throw new Error(`Not enough birds in ${b.batchId}. Available: ${U.int(b.currentQty)}.`); b.currentQty = n; Store.save('farm_batches'); },
  createBatch(d) {
    const initial = Biz.int(d.initialQty, 'Initial chicken quantity');
    const avg = Biz.pos(d.avgWeight || 0.045, 'Average weight');
    const date = Biz.need(d.arrivalDate, 'Arrival date');
    const b = Store.insert('farm_batches', {
      batchId: Biz.code('farm_batches', 'BT-', 'batchId', 3), name: Biz.need(d.name, 'Batch name'), arrivalDate: date, initialQty: initial, currentQty: initial,
      avgWeight: avg, supplier: d.supplier || '', breed: d.breed || '', status: 'Active', notes: d.notes || '', chickRate: U.num(d.chickRate), growth: [{ date, avgWeight: avg }]
    });
    Biz.move({ date, batchId: b.id, type: 'Arrival', qty: initial, effect: initial, ref: b.id, refType: 'batch', notes: 'Chicks received from ' + (b.supplier || 'supplier') });
    Biz.syncBatchExpense(b);
    Biz.log(`New batch <b>${U.esc(b.batchId)}</b> placed with ${U.int(initial)} chicks`, 'barn', 'success');
    return b;
  },
  syncBatchExpense(b) {
    if (U.num(b.chickRate) > 0) Biz.linkExpense('batch', b.id, { date: b.arrivalDate, category: 'Other Expenses', amount: U.round(b.chickRate * b.initialQty), description: `Chick purchase – ${b.batchId} (${U.int(b.initialQty)} chicks)`, reference: b.batchId, paymentMode: 'Bank Transfer' });
    else Biz.unlinkExpense('batch', b.id);
  },
  updateBatch(id, d) {
    const b = Biz.batch(id); if (!b) throw new Error('Batch not found.');
    const initial = Biz.int(d.initialQty, 'Initial chicken quantity');
    const delta = initial - b.initialQty;
    if (b.currentQty + delta < 0) throw new Error(`Initial quantity can't be reduced by ${U.int(-delta)}: only ${U.int(b.currentQty)} birds remain in the batch.`);
    const arr = Store.list('chicken_stock').find(m => m.batchId === id && m.type === 'Arrival');
    if (arr) { arr.qty = initial; arr.effect = initial; arr.date = d.arrivalDate || arr.date; Store.save('chicken_stock'); }
    const avg = Biz.pos(d.avgWeight, 'Average weight');
    if (avg !== b.avgWeight) b.growth.push({ date: U.today(), avgWeight: avg });
    Object.assign(b, { name: Biz.need(d.name, 'Batch name'), arrivalDate: Biz.need(d.arrivalDate, 'Arrival date'), initialQty: initial, currentQty: b.currentQty + delta, avgWeight: avg, supplier: d.supplier || '', breed: d.breed || '', status: d.status || b.status, notes: d.notes || '', chickRate: U.num(d.chickRate) });
    Store.save('farm_batches');
    Biz.syncBatchExpense(b);
    Biz.log(`Batch <b>${U.esc(b.batchId)}</b> updated`, 'edit');
    return b;
  },
  deleteBatch(id) {
    const b = Biz.batch(id);
    if (Store.list('delivery_trips').some(t => t.batchId === id)) throw new Error('This batch has delivery trips. Close the batch instead of deleting it.');
    if (Store.list('feed_consumption').some(c => c.batchId === id)) throw new Error('This batch has feed consumption records. Close the batch instead of deleting it.');
    Store.list('chicken_stock').filter(m => m.batchId === id).forEach(m => Store.remove('chicken_stock', m.id));
    Store.list('farm_mortality').filter(m => m.batchId === id).forEach(m => Store.remove('farm_mortality', m.id));
    Biz.unlinkExpense('batch', id);
    Store.remove('farm_batches', id);
    Biz.log(`Batch <b>${U.esc(b.batchId)}</b> deleted`, 'trash', 'danger');
  },
  recordMortality(d) {
    const b = Biz.batch(d.batchId); if (!b) throw new Error('Select a batch.');
    const qty = Biz.int(d.qty, 'Mortality count');
    if (qty > b.currentQty) throw new Error(`Mortality (${qty}) is more than the birds in ${b.batchId} (${U.int(b.currentQty)}).`);
    const date = Biz.need(d.date, 'Date');
    const m = Store.insert('farm_mortality', { batchId: b.id, date, qty, cause: d.cause || 'Natural', notes: d.notes || '' });
    Biz.setStock(b, -qty);
    Biz.move({ date, batchId: b.id, type: 'Mortality', qty, effect: -qty, ref: m.id, refType: 'mortality', notes: m.cause });
    Biz.log(`${qty} birds recorded as mortality in <b>${U.esc(b.batchId)}</b>`, 'alert', 'danger');
    return m;
  },
  deleteMortality(id) {
    const m = Store.get('farm_mortality', id); const b = Biz.batch(m.batchId);
    if (b) Biz.setStock(b, m.qty);
    Store.list('chicken_stock').filter(x => x.ref === id).forEach(x => Store.remove('chicken_stock', x.id));
    Store.remove('farm_mortality', id);
  },
  logWeight(batchId, date, avg) {
    const b = Biz.batch(batchId); if (!b) throw new Error('Select a batch.');
    const w = Biz.pos(avg, 'Average weight');
    b.growth.push({ date: Biz.need(date, 'Date'), avgWeight: w });
    b.growth.sort((a, c) => a.date.localeCompare(c.date));
    b.avgWeight = b.growth[b.growth.length - 1].avgWeight;
    Store.save('farm_batches');
  },
  adjustStock(d) {
    const b = Biz.batch(d.batchId); if (!b) throw new Error('Select a batch.');
    const qty = Biz.int(d.qty, 'Quantity');
    const type = d.type;
    const effect = type === 'Adjustment In' ? qty : -qty;
    Biz.setStock(b, effect);
    Biz.move({ date: Biz.need(d.date, 'Date'), batchId: b.id, type, qty, effect, refType: 'adjust', notes: d.notes || '' });
    Biz.log(`Stock ${type.toLowerCase()} of ${qty} birds in <b>${U.esc(b.batchId)}</b>`, 'box', 'warning');
  },
  stockSummary() {
    return Store.derive('stockSummary', () => {
      const by = {};
      for (const b of Store.list('farm_batches')) by[b.id] = { b, arrival: 0, mortality: 0, loaded: 0, delivered: 0, returned: 0, damaged: 0, adjIn: 0, adjOut: 0 };
      for (const m of Store.list('chicken_stock')) {
        const x = by[m.batchId]; if (!x) continue;
        if (m.type === 'Arrival') x.arrival += m.qty; else if (m.type === 'Mortality') x.mortality += m.qty; else if (m.type === 'Loaded') x.loaded += m.qty;
        else if (m.type === 'Sold') x.delivered += m.qty; else if (m.type === 'Returned') x.returned += m.qty; else if (m.type === 'Damaged') x.damaged += m.qty;
        else if (m.type === 'Adjustment In') x.adjIn += m.qty; else if (m.type === 'Adjustment Out') x.adjOut += m.qty;
      }
      return by;
    });
  },
  farmStock() { return U.sum(Store.list('farm_batches'), 'currentQty'); },
  inVehicles() {
    return Store.list('delivery_trips').filter(t => t.status === 'In Transit').reduce((a, t) => a + t.loadedQty - U.sum(Biz.tripItems(t.id).filter(i => i.status === 'Delivered'), 'qty'), 0);
  },

  /* ---------- Feed ---------- */
  feedStock() {
    return Store.derive('feedStock', () => {
      const m = new Map();
      const get = (name, cat, unit) => { if (!m.has(name)) m.set(name, { name, category: cat || '', unit: unit || 'kg', purchased: 0, consumed: 0, value: 0 }); return m.get(name); };
      for (const p of Store.list('feed_purchases')) { const x = get(p.feedName, p.category, p.unit); x.purchased += U.num(p.qty); x.value += U.num(p.total); x.category = p.category || x.category; x.unit = p.unit || x.unit; }
      for (const c of Store.list('feed_consumption')) { const x = get(c.feedName, '', c.unit); x.consumed += U.num(c.qty); }
      for (const x of m.values()) { x.remaining = U.round(x.purchased - x.consumed, 2); x.avgRate = x.purchased ? x.value / x.purchased : 0; }
      return m;
    });
  },
  feedRemaining(name) { return Biz.feedStock().get(name)?.remaining || 0; },
  saveFeedPurchase(d, id) {
    const qty = Biz.pos(d.qty, 'Quantity'), rate = Biz.pos(d.rate, 'Rate', { allowZero: true });
    const rec = { date: Biz.need(d.date, 'Purchase date'), feedName: Biz.need(d.feedName, 'Feed name'), category: d.category || '', supplier: d.supplier || '', qty, unit: d.unit || 'kg', rate, total: U.round(qty * rate), invoiceRef: d.invoiceRef || '' };
    if (id) {
      const old = Store.get('feed_purchases', id);
      const remOld = Biz.feedRemaining(old.feedName) - old.qty + (old.feedName === rec.feedName ? qty : 0);
      if (remOld < -0.001) throw new Error(`${old.feedName} has already been consumed beyond this quantity. Remaining would be ${U.dec(remOld)} ${old.unit}.`);
      Store.update('feed_purchases', id, rec);
    } else id = Store.insert('feed_purchases', rec).id;
    Biz.linkExpense('feed', id, { date: rec.date, category: 'Chicken Feed', amount: rec.total, description: `${rec.feedName} – ${U.dec(qty, 0)} ${rec.unit}`, reference: rec.invoiceRef || rec.supplier, paymentMode: d.paymentMode || 'Bank Transfer' });
    Biz.log(`Feed purchase: ${U.dec(qty, 0)} ${U.esc(rec.unit)} of <b>${U.esc(rec.feedName)}</b>`, 'sack', 'warning');
    return id;
  },
  deleteFeedPurchase(id) {
    const p = Store.get('feed_purchases', id);
    if (Biz.feedRemaining(p.feedName) - p.qty < -0.001) throw new Error(`Can't delete: part of this ${p.feedName} stock has already been consumed.`);
    Store.remove('feed_purchases', id); Biz.unlinkExpense('feed', id);
  },
  saveConsumption(d, id) {
    const qty = Biz.pos(d.qty, 'Consumed quantity');
    const name = Biz.need(d.feedName, 'Feed');
    const old = id ? Store.get('feed_consumption', id) : null;
    const avail = Biz.feedRemaining(name) + (old && old.feedName === name ? old.qty : 0);
    if (qty > avail + 0.001) throw new Error(`Only ${U.dec(avail)} ${Biz.feedStock().get(name)?.unit || 'kg'} of ${name} is in stock.`);
    const rec = { date: Biz.need(d.date, 'Consumption date'), feedName: name, batchId: d.batchId || '', qty, unit: Biz.feedStock().get(name)?.unit || 'kg', notes: d.notes || '' };
    if (id) Store.update('feed_consumption', id, rec); else Store.insert('feed_consumption', rec);
  },

  /* ---------- Vehicles ---------- */
  vehicle(id) { return Store.get('vehicles', id); },
  saveVehicle(d, id) {
    const reg = Biz.need(d.regNo, 'Registration number').toUpperCase();
    if (Store.list('vehicles').some(v => v.regNo === reg && v.id !== id)) throw new Error('Another vehicle already uses ' + reg + '.');
    const rec = { name: Biz.need(d.name, 'Vehicle name'), regNo: reg, driver: Biz.need(d.driver, 'Driver name'), driverPhone: d.driverPhone || '', fuelType: d.fuelType || 'Diesel', odometer: Biz.pos(d.odometer || 0, 'Odometer', { allowZero: true }), status: d.status || 'Available', model: d.model || 'Mahindra Bolero Pik-Up', capacity: U.num(d.capacity) };
    if (id) { const v = Biz.vehicle(id); if (v.status === 'On Trip' && rec.status !== 'On Trip') { if (Store.list('delivery_trips').some(t => t.vehicleId === id && t.status === 'In Transit')) throw new Error('This vehicle is on an active trip. Complete the trip first.'); } Store.update('vehicles', id, rec); }
    else { id = Store.insert('vehicles', rec).id; Biz.log(`Vehicle <b>${U.esc(rec.name)}</b> added`, 'truck'); }
    return id;
  },
  deleteVehicle(id) {
    if (Store.list('delivery_trips').some(t => t.vehicleId === id) || Store.list('vehicle_fuel').some(f => f.vehicleId === id)) throw new Error('This vehicle has trip or fuel history. Set its status to Inactive instead.');
    Store.list('vehicle_maintenance').filter(m => m.vehicleId === id).forEach(m => { Biz.unlinkExpense('maintenance', m.id); Store.remove('vehicle_maintenance', m.id); });
    Store.remove('vehicles', id);
  },
  saveFuel(d, id) {
    const v = Biz.vehicle(d.vehicleId); if (!v) throw new Error('Select a vehicle.');
    const qty = Biz.pos(d.qty, 'Fuel quantity'), price = Biz.pos(d.price, 'Price per litre');
    const odo = U.num(d.odometer);
    const rec = { date: Biz.need(d.date, 'Fuel date'), vehicleId: v.id, fuelType: d.fuelType || v.fuelType, qty, price, total: U.round(qty * price), odometer: odo, station: d.station || '' };
    if (id) Store.update('vehicle_fuel', id, rec); else id = Store.insert('vehicle_fuel', rec).id;
    if (odo > U.num(v.odometer)) { v.odometer = odo; Store.save('vehicles'); }
    Biz.linkExpense('fuel', id, { date: rec.date, category: 'Fuel', amount: rec.total, description: `${rec.fuelType} ${U.dec(qty, 1)} L – ${v.name}`, reference: v.regNo, vehicleId: v.id, paymentMode: d.paymentMode || 'Cash' });
    return id;
  },
  deleteFuel(id) { Store.remove('vehicle_fuel', id); Biz.unlinkExpense('fuel', id); },
  saveMaintenance(d, id) {
    const v = Biz.vehicle(d.vehicleId); if (!v) throw new Error('Select a vehicle.');
    const rec = { date: Biz.need(d.date, 'Service date'), vehicleId: v.id, serviceType: Biz.need(d.serviceType, 'Service type'), cost: Biz.pos(d.cost, 'Service cost', { allowZero: true }), nextDate: d.nextDate || '', garage: d.garage || '', notes: d.notes || '' };
    if (rec.nextDate && rec.nextDate < rec.date) throw new Error('Next service date must be after the service date.');
    if (id) Store.update('vehicle_maintenance', id, rec); else id = Store.insert('vehicle_maintenance', rec).id;
    Biz.linkExpense('maintenance', id, { date: rec.date, category: 'Vehicle Maintenance', amount: rec.cost, description: `${rec.serviceType} – ${v.name}`, reference: v.regNo, vehicleId: v.id, paymentMode: d.paymentMode || 'Cash' });
    Biz.log(`${U.esc(rec.serviceType)} recorded for <b>${U.esc(v.name)}</b>`, 'wrench', 'orange');
    return id;
  },
  deleteMaintenance(id) { Store.remove('vehicle_maintenance', id); Biz.unlinkExpense('maintenance', id); },
  nextService(vid) { const l = Store.list('vehicle_maintenance').filter(m => m.vehicleId === vid && m.nextDate).sort((a, b) => b.date.localeCompare(a.date)); return l[0]?.nextDate || ''; },

  /* ---------- Customers ---------- */
  customer(id) { return Store.get('customers', id); },
  saveCustomer(d, id) {
    const rec = { shopName: Biz.need(d.shopName, 'Shop name'), owner: Biz.need(d.owner, 'Owner name'), phone: Biz.need(d.phone, 'Contact number'), email: d.email || '', address: d.address || '', area: d.area || '', status: d.status || 'Active', openingBalance: U.num(d.openingBalance), defaultRate: U.num(d.defaultRate), creditDays: U.num(d.creditDays), gst: d.gst || '', notes: d.notes || '' };
    if (Store.list('customers').some(c => c.shopName.toLowerCase() === rec.shopName.toLowerCase() && c.id !== id)) throw new Error('A shop named "' + rec.shopName + '" already exists.');
    if (id) Store.update('customers', id, rec);
    else { rec.code = Biz.code('customers', 'CUS-', 'code', 4); rec.since = d.since || U.today(); id = Store.insert('customers', rec).id; Biz.log(`New customer <b>${U.esc(rec.shopName)}</b> added`, 'userPlus', 'pink'); }
    return id;
  },
  deleteCustomer(id) {
    if (Store.list('invoices').some(i => i.customerId === id) || Store.list('delivery_items').some(i => i.customerId === id)) throw new Error('This shop has deliveries or invoices. Set it to Inactive instead.');
    Store.remove('customers', id);
  },
  custAgg() {
    return Store.derive('custAgg', () => {
      const m = new Map(); const paid = Biz.paidMap();
      for (const c of Store.list('customers')) m.set(c.id, { invoices: 0, purchases: 0, paid: 0, birds: 0, weight: 0, last: '' });
      for (const inv of Store.list('invoices')) {
        if (inv.cancelled || inv.draft) continue; const x = m.get(inv.customerId); if (!x) continue;
        x.invoices++; x.purchases += inv.total; x.birds += U.sum(inv.items, 'qty'); x.weight += U.sum(inv.items, 'weight'); if (inv.date > x.last) x.last = inv.date;
      }
      for (const p of Store.list('payments')) { const x = m.get(p.customerId); if (x) x.paid += U.num(p.amount); }
      for (const [id, x] of m) { const c = Biz.customer(id); x.opening = U.num(c.openingBalance); x.outstanding = U.round(x.opening + x.purchases - x.paid); }
      return m;
    });
  },

  /* ---------- Delivery trips ---------- */
  trip(id) { return Store.get('delivery_trips', id); },
  tripItems(tripId) { return Store.derive('itemsByTrip', () => U.groupBy(Store.list('delivery_items'), i => i.tripId)).get(tripId) || []; },
  createTrip(d, items = []) {
    const v = Biz.vehicle(d.vehicleId); if (!v) throw new Error('Select a vehicle.');
    if (v.status === 'Maintenance' || v.status === 'Inactive') throw new Error(`${v.name} is marked ${v.status}.`);
    if (Store.list('delivery_trips').some(t => t.vehicleId === v.id && t.status === 'In Transit')) throw new Error(`${v.name} is already on an active trip. Complete that trip first.`);
    const b = Biz.batch(d.batchId); if (!b) throw new Error('Select the batch to load from.');
    if (b.status === 'Closed') throw new Error(`${b.batchId} is closed.`);
    const loaded = Biz.int(d.loadedQty, 'Loaded quantity');
    if (loaded > b.currentQty) throw new Error(`Only ${U.int(b.currentQty)} birds available in ${b.batchId}.`);
    const itemQty = U.sum(items, 'qty');
    if (itemQty > loaded) throw new Error(`Shop quantities (${U.int(itemQty)}) exceed the loaded quantity (${U.int(loaded)}).`);
    const date = Biz.need(d.date, 'Delivery date');
    const t = Store.insert('delivery_trips', { ref: Biz.code('delivery_trips', 'DLV-', 'ref', 4), date, vehicleId: v.id, driver: d.driver || v.driver, departure: d.departure || '', returnTime: '', batchId: b.id, loadedQty: loaded, deliveredQty: 0, returnedQty: 0, status: 'In Transit', notes: d.notes || '' });
    Biz.setStock(b, -loaded);
    Biz.move({ date, batchId: b.id, type: 'Loaded', qty: loaded, effect: -loaded, ref: t.id, refType: 'trip', notes: `${t.ref} · ${v.name}` });
    v.status = 'On Trip'; Store.save('vehicles');
    for (const it of items) Biz.saveTripItem(t.id, it);
    Biz.log(`Trip <b>${t.ref}</b> loaded ${U.int(loaded)} birds on ${U.esc(v.name)}`, 'truck', 'primary');
    return t;
  },
  updateTrip(id, d) {
    const t = Biz.trip(id); if (!t) throw new Error('Trip not found.');
    if (t.status !== 'In Transit') { Object.assign(t, { driver: d.driver || t.driver, departure: d.departure ?? t.departure, returnTime: d.returnTime ?? t.returnTime, notes: d.notes ?? t.notes }); Store.save('delivery_trips'); return t; }
    const loaded = Biz.int(d.loadedQty, 'Loaded quantity');
    const used = U.sum(Biz.tripItems(id).filter(i => i.status !== 'Cancelled'), 'qty');
    if (loaded < used) throw new Error(`Loaded quantity can't be less than the ${U.int(used)} birds already assigned to shops.`);
    const oldB = Biz.batch(t.batchId), newB = Biz.batch(d.batchId || t.batchId);
    if (!newB) throw new Error('Select the batch to load from.');
    const mv = Store.list('chicken_stock').find(m => m.ref === id && m.type === 'Loaded');
    if (newB.id !== oldB.id) { if (loaded > newB.currentQty) throw new Error(`Only ${U.int(newB.currentQty)} birds available in ${newB.batchId}.`); Biz.setStock(oldB, t.loadedQty); Biz.setStock(newB, -loaded); }
    else { const delta = loaded - t.loadedQty; if (delta > oldB.currentQty) throw new Error(`Only ${U.int(oldB.currentQty)} more birds available in ${oldB.batchId}.`); Biz.setStock(oldB, -delta); }
    if (mv) { mv.batchId = newB.id; mv.qty = loaded; mv.effect = -loaded; mv.date = d.date || mv.date; Store.save('chicken_stock'); }
    if (d.vehicleId && d.vehicleId !== t.vehicleId) {
      const nv = Biz.vehicle(d.vehicleId);
      if (Store.list('delivery_trips').some(x => x.vehicleId === nv.id && x.status === 'In Transit' && x.id !== id)) throw new Error(`${nv.name} is already on an active trip.`);
      const ov = Biz.vehicle(t.vehicleId); if (ov) ov.status = 'Available'; nv.status = 'On Trip'; Store.save('vehicles'); t.vehicleId = nv.id;
    }
    Object.assign(t, { date: d.date || t.date, driver: d.driver || t.driver, departure: d.departure || '', batchId: newB.id, loadedQty: loaded, notes: d.notes || '' });
    Store.save('delivery_trips');
    return t;
  },
  saveTripItem(tripId, d, itemId) {
    const t = Biz.trip(tripId); if (!t) throw new Error('Trip not found.');
    if (t.status !== 'In Transit') throw new Error('Shops can only be changed while the trip is in transit.');
    const c = Biz.customer(d.customerId); if (!c) throw new Error('Select a shop.');
    const qty = Biz.int(d.qty, 'Chicken quantity');
    const weight = Biz.pos(d.weight, 'Total weight');
    const rate = Biz.pos(d.rate, 'Price per kg', { allowZero: true });
    const others = U.sum(Biz.tripItems(tripId).filter(i => i.id !== itemId && i.status !== 'Cancelled'), 'qty');
    if (others + qty > t.loadedQty) throw new Error(`Only ${U.int(t.loadedQty - others)} loaded birds are left to assign on this trip.`);
    const rec = { tripId, customerId: c.id, qty, weight: U.round(weight, 2), rate, amount: U.round(weight * rate), status: d.status || 'Pending' };
    if (itemId) { const it = Store.get('delivery_items', itemId); if (it.invoiceId) throw new Error('This delivery is already invoiced. Edit the invoice instead.'); Store.update('delivery_items', itemId, rec); return itemId; }
    return Store.insert('delivery_items', Object.assign(rec, { invoiceId: '' })).id;
  },
  deleteTripItem(id) {
    const it = Store.get('delivery_items', id); const t = Biz.trip(it.tripId);
    if (it.invoiceId) throw new Error('This delivery is invoiced. Delete or cancel the invoice first.');
    if (t.status !== 'In Transit') throw new Error('Shops can only be removed while the trip is in transit.');
    Store.remove('delivery_items', id);
  },
  setItemStatus(id, status) {
    const it = Store.get('delivery_items', id); const t = Biz.trip(it.tripId);
    if (t.status !== 'In Transit') throw new Error('The trip is already closed.');
    it.status = status; Store.save('delivery_items');
  },
  completeTrip(id, { returnTime = '', odometerEnd = 0, autoInvoice = true } = {}) {
    const t = Biz.trip(id); if (!t) throw new Error('Trip not found.');
    if (t.status !== 'In Transit') throw new Error('This trip is already ' + t.status.toLowerCase() + '.');
    const items = Biz.tripItems(id);
    items.forEach(i => { if (i.status === 'Pending') i.status = 'Delivered'; });
    Store.save('delivery_items');
    const delivered = U.sum(items.filter(i => i.status === 'Delivered'), 'qty');
    const returned = t.loadedQty - delivered;
    const b = Biz.batch(t.batchId);
    if (delivered > 0) Biz.move({ date: t.date, batchId: b.id, type: 'Sold', qty: delivered, effect: 0, ref: t.id, refType: 'trip', notes: `${t.ref} · delivered to ${items.filter(i => i.status === 'Delivered').length} shops` });
    if (returned > 0) { Biz.setStock(b, returned); Biz.move({ date: t.date, batchId: b.id, type: 'Returned', qty: returned, effect: returned, ref: t.id, refType: 'trip', notes: `${t.ref} · unsold birds returned to farm` }); }
    Object.assign(t, { status: 'Completed', deliveredQty: delivered, returnedQty: returned, returnTime: returnTime || t.returnTime });
    Store.save('delivery_trips');
    const v = Biz.vehicle(t.vehicleId);
    if (v) { v.status = 'Available'; if (U.num(odometerEnd) > U.num(v.odometer)) v.odometer = U.num(odometerEnd); t.odometerEnd = U.num(odometerEnd) || ''; Store.save('vehicles'); }
    const created = [];
    if (autoInvoice) items.filter(i => i.status === 'Delivered' && !i.invoiceId).forEach(i => created.push(Biz.invoiceFromItem(i.id)));
    Biz.log(`Trip <b>${t.ref}</b> completed · ${U.int(delivered)} delivered, ${U.int(returned)} returned`, 'checkCircle', 'success');
    return { delivered, returned, invoices: created };
  },
  cancelTrip(id) {
    const t = Biz.trip(id);
    if (t.status !== 'In Transit') throw new Error('Only trips in transit can be cancelled.');
    const items = Biz.tripItems(id);
    if (items.some(i => i.invoiceId)) throw new Error('Some deliveries on this trip are invoiced. Cancel those invoices first.');
    const b = Biz.batch(t.batchId);
    Biz.setStock(b, t.loadedQty);
    Biz.move({ date: t.date, batchId: b.id, type: 'Returned', qty: t.loadedQty, effect: t.loadedQty, ref: t.id, refType: 'trip', notes: `${t.ref} cancelled · all birds returned` });
    items.forEach(i => i.status = 'Cancelled'); Store.save('delivery_items');
    t.status = 'Cancelled'; t.returnedQty = t.loadedQty; Store.save('delivery_trips');
    const v = Biz.vehicle(t.vehicleId); if (v) { v.status = 'Available'; Store.save('vehicles'); }
    Biz.log(`Trip <b>${t.ref}</b> cancelled`, 'xCircle', 'danger');
  },
  deleteTrip(id) {
    const t = Biz.trip(id);
    if (t.status === 'Completed') throw new Error('Completed trips can\'t be deleted because they affect stock and invoices.');
    if (t.status === 'In Transit') Biz.cancelTrip(id);
    Store.list('chicken_stock').filter(m => m.ref === id).forEach(m => Store.remove('chicken_stock', m.id));
    Biz.tripItems(id).slice().forEach(i => Store.remove('delivery_items', i.id));
    Store.remove('delivery_trips', id);
  },

  /* ---------- Invoices ---------- */
  invoice(id) { return Store.get('invoices', id); },
  paidMap() { return Store.derive('paidMap', () => { const m = new Map(); for (const p of Store.list('payments')) m.set(p.invoiceId, (m.get(p.invoiceId) || 0) + U.num(p.amount)); return m; }); },
  paid(inv) { return U.round(Biz.paidMap().get(inv.id) || 0); },
  balance(inv) { return (inv.cancelled || inv.draft) ? 0 : U.round(inv.total - Biz.paid(inv)); },
  status(inv) {
    if (inv.cancelled) return 'Cancelled';
    if (inv.draft) return 'Draft';
    const paid = Biz.paid(inv);
    if (paid >= inv.total - 0.005) return 'Paid';
    if (inv.dueDate && inv.dueDate < U.today()) return 'Overdue';
    return paid > 0 ? 'Partially Paid' : 'Unpaid';
  },
  validInvoices() { return Store.list('invoices').filter(i => !i.cancelled && !i.draft); },
  calc(items, discount, charges) {
    const subtotal = U.round(U.sum(items, 'amount'));
    return { subtotal, total: U.round(subtotal - U.num(discount) + U.num(charges)) };
  },
  nextInvoiceNo() {
    const s = Biz.s(); const taken = new Set(Store.list('invoices').map(i => i.number));
    let n = Math.max(1, parseInt(s.nextInvoiceNo, 10) || 1), num;
    do { num = s.invoicePrefix + U.pad(n, 5); n++; } while (taken.has(num));
    return num;
  },
  saveInvoice(d, id) {
    const c = Biz.customer(d.customerId); if (!c) throw new Error('Select a customer.');
    const items = (d.items || []).filter(i => String(i.desc || '').trim() || U.num(i.amount)).map(i => ({ desc: String(i.desc || '').trim() || 'Live broiler chicken', qty: U.num(i.qty), weight: U.round(i.weight, 2), rate: U.num(i.rate), amount: U.round(U.num(i.amount) || U.num(i.weight) * U.num(i.rate)) }));
    if (!items.length) throw new Error('Add at least one item.');
    if (items.some(i => i.qty < 0 || i.weight < 0 || i.rate < 0)) throw new Error('Item quantities, weights and rates can\'t be negative.');
    const discount = U.num(d.discount), charges = U.num(d.charges);
    if (discount < 0 || charges < 0) throw new Error('Discount and additional charges can\'t be negative.');
    const { subtotal, total } = Biz.calc(items, discount, charges);
    if (total < 0) throw new Error('Discount is larger than the invoice amount.');
    const date = Biz.need(d.date, 'Invoice date');
    const dueDate = d.dueDate || U.addDays(date, Biz.s().dueDays);
    if (dueDate < date) throw new Error('Due date must be on or after the invoice date.');
    const trip = d.tripId ? Biz.trip(d.tripId) : null; const veh = trip ? Biz.vehicle(trip.vehicleId) : null;
    if (d.deliveryItemId) { const it = Store.get('delivery_items', d.deliveryItemId); if (it && it.invoiceId && it.invoiceId !== id) throw new Error('That delivery is already invoiced as ' + (Biz.invoice(it.invoiceId)?.number || 'another invoice') + '.'); }
    const rec = {
      customerId: c.id, date, dueDate, tripId: trip?.id || '', deliveryRef: trip?.ref || d.deliveryRef || '', deliveryItemId: d.deliveryItemId || '', vehicleName: veh ? `${veh.name} (${veh.regNo})` : (d.vehicleName || ''), driver: trip?.driver || '',
      items, discount, charges, subtotal, total, notes: d.notes ?? Biz.s().notes, terms: d.terms ?? Biz.s().terms, draft: !!d.draft,
      billTo: { shopName: c.shopName, owner: c.owner, address: (c.area && !String(c.address).toLowerCase().includes(c.area.toLowerCase())) ? [c.address, c.area].filter(Boolean).join(', ') : (c.address || c.area || ''), phone: c.phone, email: c.email, gst: c.gst }
    };
    let inv;
    if (id) {
      inv = Biz.invoice(id);
      if (inv.cancelled) throw new Error('Cancelled invoices can\'t be edited.');
      if (total < Biz.paid(inv) - 0.005) throw new Error(`Total can't be less than the ${U.money(Biz.paid(inv))} already received.`);
      if (rec.draft && Biz.paid(inv) > 0) throw new Error('An invoice with payments can\'t be moved back to draft.');
      if (inv.deliveryItemId && inv.deliveryItemId !== rec.deliveryItemId) { const old = Store.get('delivery_items', inv.deliveryItemId); if (old) { old.invoiceId = ''; Store.save('delivery_items'); } }
      Store.update('invoices', id, rec);
    } else {
      rec.number = Biz.nextInvoiceNo();
      inv = Store.insert('invoices', rec);
      const n = parseInt(rec.number.replace(/\D+/g, ''), 10); const s = Biz.s();
      if (n >= (parseInt(s.nextInvoiceNo, 10) || 1)) Store.saveSettings({ nextInvoiceNo: n + 1 });
      Biz.log(`Invoice <b>${inv.number}</b> created for ${U.esc(c.shopName)}`, 'file', 'primary');
    }
    if (rec.deliveryItemId) { const it = Store.get('delivery_items', rec.deliveryItemId); if (it) { it.invoiceId = inv.id; Store.save('delivery_items'); } }
    return inv;
  },
  invoiceFromItem(itemId) {
    const it = Store.get('delivery_items', itemId); if (!it) throw new Error('Delivery not found.');
    if (it.invoiceId) throw new Error('Already invoiced.');
    if (it.status !== 'Delivered') throw new Error('Only delivered shops can be invoiced.');
    const t = Biz.trip(it.tripId); const c = Biz.customer(it.customerId); const b = Biz.batch(t.batchId);
    const days = U.num(c.creditDays) || Biz.s().dueDays;
    return Biz.saveInvoice({ customerId: c.id, date: t.date, dueDate: U.addDays(t.date, days), tripId: t.id, deliveryItemId: it.id, items: [{ desc: `Live broiler chicken${b ? ' – ' + b.batchId : ''}`, qty: it.qty, weight: it.weight, rate: it.rate, amount: it.amount }], discount: 0, charges: 0 });
  },
  cancelInvoice(id) {
    const inv = Biz.invoice(id);
    if (Biz.paid(inv) > 0) throw new Error('This invoice has payments. Delete those payments before cancelling.');
    inv.cancelled = true;
    if (inv.deliveryItemId) { const it = Store.get('delivery_items', inv.deliveryItemId); if (it && it.invoiceId === id) { it.invoiceId = ''; Store.save('delivery_items'); } }
    Store.save('invoices');
    Biz.log(`Invoice <b>${inv.number}</b> cancelled`, 'xCircle', 'danger');
  },
  deleteInvoice(id) {
    const inv = Biz.invoice(id);
    if (Biz.paid(inv) > 0) throw new Error('This invoice has payments. Delete those payments first.');
    if (inv.deliveryItemId) { const it = Store.get('delivery_items', inv.deliveryItemId); if (it && it.invoiceId === id) { it.invoiceId = ''; Store.save('delivery_items'); } }
    Store.remove('invoices', id);
  },

  /* ---------- Payments ---------- */
  savePayment(d, id) {
    const inv = Biz.invoice(d.invoiceId); if (!inv) throw new Error('Select an invoice.');
    if (inv.cancelled) throw new Error('Payments can\'t be recorded on a cancelled invoice.');
    if (inv.draft) throw new Error('Finalise the draft invoice before recording a payment.');
    const amount = U.round(Biz.pos(d.amount, 'Amount'));
    const old = id ? Store.get('payments', id) : null;
    const bal = U.round(inv.total - Biz.paid(inv) + (old && old.invoiceId === inv.id ? old.amount : 0));
    if (amount > bal + 0.005) throw new Error(`Amount is more than the balance due (${U.money(bal)}).`);
    const method = Biz.need(d.method, 'Payment method');
    if (method !== 'Cash' && !String(d.txnRef || '').trim() && d._strict) throw new Error('Enter the transaction reference for ' + method + ' payments.');
    const rec = { date: Biz.need(d.date, 'Payment date'), invoiceId: inv.id, customerId: inv.customerId, method, amount, txnRef: d.txnRef || '', notes: d.notes || '' };
    if (id) Store.update('payments', id, rec);
    else { rec.receiptNo = Biz.code('payments', 'RCPT-', 'receiptNo', 5); id = Store.insert('payments', rec).id; Biz.log(`Payment of <b>${U.money(amount)}</b> received for ${inv.number}`, 'wallet', 'success'); }
    return id;
  },
  deletePayment(id) { Store.remove('payments', id); },

  /* ---------- Expenses ---------- */
  saveExpense(d, id) {
    const rec = { date: Biz.need(d.date, 'Expense date'), category: Biz.need(d.category, 'Category'), description: d.description || '', amount: U.round(Biz.pos(d.amount, 'Amount')), paymentMode: d.paymentMode || 'Cash', reference: d.reference || '', status: d.status || 'Paid', vehicleId: d.vehicleId || '' };
    if (id) { const e = Store.get('expenses', id); if (e.source && e.source !== 'manual') throw new Error('This expense is created automatically. Edit it from its source module.'); Store.update('expenses', id, rec); }
    else { rec.expId = Biz.code('expenses', 'EXP-', 'expId', 5); rec.source = 'manual'; id = Store.insert('expenses', rec).id; Biz.log(`Expense <b>${U.money(rec.amount)}</b> added under ${U.esc(rec.category)}`, 'receipt', 'orange'); }
    return id;
  },
  deleteExpense(id) { const e = Store.get('expenses', id); if (e.source && e.source !== 'manual') throw new Error('This expense is linked to a ' + e.source + ' record. Delete it from that module.'); Store.remove('expenses', id); },
  linkExpense(source, sourceId, data) {
    const ex = Store.list('expenses').find(e => e.source === source && e.sourceId === sourceId);
    const rec = Object.assign({ status: 'Paid', paymentMode: 'Cash', reference: '', vehicleId: '' }, data, { amount: U.round(data.amount) });
    if (ex) { Object.assign(ex, rec); Store.save('expenses'); return ex; }
    return Store.insert('expenses', Object.assign(rec, { expId: Biz.code('expenses', 'EXP-', 'expId', 5), source, sourceId }));
  },
  unlinkExpense(source, sourceId) { const ex = Store.list('expenses').find(e => e.source === source && e.sourceId === sourceId); if (ex) Store.remove('expenses', ex.id); },

  /* ---------- Metrics ---------- */
  revenue(from, to) { return U.sum(Biz.validInvoices().filter(i => U.inRange(i.date, from, to)), 'total'); },
  expenseTotal(from, to) { return U.sum(Store.list('expenses').filter(e => U.inRange(e.date, from, to)), 'amount'); },
  collected(from, to) { return U.sum(Store.list('payments').filter(p => U.inRange(p.date, from, to)), 'amount'); },
  outstanding() { let t = 0; for (const x of Biz.custAgg().values()) t += Math.max(0, x.outstanding); return U.round(t); },
  alerts() {
    const out = [], T = U.today();
    const overdue = Biz.validInvoices().filter(i => Biz.status(i) === 'Overdue');
    if (overdue.length) out.push({ icon: 'alert', color: 'danger', text: `${overdue.length} invoices are overdue (${U.money0(U.sum(overdue, i => Biz.balance(i)))})`, go: ['invoices', { tab: 'Overdue' }] });
    for (const f of Biz.feedStock().values()) if (f.remaining < 1000 && f.purchased > 0) out.push({ icon: 'sack', color: 'warning', text: `${f.name} is low: ${U.dec(f.remaining, 0)} ${f.unit} left`, go: ['feed', {}] });
    for (const v of Store.list('vehicles')) { const n = Biz.nextService(v.id); if (n && U.diffDays(n, T) <= 7) out.push({ icon: 'wrench', color: 'orange', text: `${v.name} service ${n < T ? 'was due' : 'due'} on ${U.date(n)}`, go: ['vehicles', { tab: 'maintenance' }] }); }
    const transit = Store.list('delivery_trips').filter(t => t.status === 'In Transit');
    if (transit.length) out.push({ icon: 'truck', color: 'primary', text: `${transit.length} trip${transit.length > 1 ? 's' : ''} in transit`, go: ['deliveries', {}] });
    for (const b of Biz.activeBatches()) if (Biz.batchAge(b) >= Biz.s().readyAge && Biz.batchAge(b) < Biz.s().readyAge + 2) out.push({ icon: 'barn', color: 'success', text: `${b.batchId} is ready for sale (${Biz.batchAge(b)} days)`, go: ['farm', {}] });
    return out;
  }
};

        for (const [ao] of arrivals) if (ao + 10 === off) { Biz.clock = at(day, 16); Biz.saveExpense({ date: day, category: 'Other Expenses', amount: U.randInt(6000, 9500), description: 'Vaccines & medicine', paymentMode: 'UPI' }); }
        // fuel & maintenance
        vehicles.forEach((v, k) => {
          if ((off + k) % 3 === 0) { Biz.clock = at(day, 6, 15); Biz.saveFuel({ date: day, vehicleId: v.id, fuelType: 'Diesel', qty: U.randInt(30, 42), price: U.round(92 + U.rand(0, 1.5), 2), odometer: v.odometer + U.randInt(5, 20), station: U.pick(['Indian Oil – Bypass', 'HP – Market Road', 'Bharat Petroleum – Highway']) }); }
          if ((off + 150 + k * 13) % 42 === 0) { Biz.clock = at(day, 17); Biz.saveMaintenance({ date: day, vehicleId: v.id, serviceType: U.pick(['General Service', 'Oil Change', 'Brake Service', 'Tyre Replacement', 'Clutch Repair']), cost: U.randInt(2800, 7500), nextDate: U.addDays(day, 42), garage: 'Mahindra Authorised Service', notes: '' }); }
        });
        // sales
        if (off >= -128) {
          const trips = 3;
          for (let k = 0; k < trips; k++) {
            const ready = Biz.activeBatches().filter(b => U.diffDays(day, b.arrivalDate) >= 35 && b.currentQty > 0).sort((a, b) => a.arrivalDate.localeCompare(b.arrivalDate));
            const b = ready[0]; if (!b) break;
            const v = vehicles[(rr++) % 3];
            const picks = activeCusts.slice().sort(() => Math.random() - 0.5).slice(0, 4);
            let items = picks.map(c => ({ customerId: c.id, qty: U.randInt(28, 42) }));
            let loaded = U.sum(items, 'qty') + U.randInt(4, 12);
            if (loaded > b.currentQty) { loaded = b.currentQty; let left = loaded; items = items.map(it => { const q = Math.min(it.qty, left); left -= q; return Object.assign(it, { qty: q }); }).filter(it => it.qty > 0); }
            const age = U.diffDays(day, b.arrivalDate);
            const trend = Math.round(6 * Math.sin((off + 170) / 23)) + 4;
            items.forEach(it => { const c = Biz.customer(it.customerId); it.weight = U.round(it.qty * wfn(age) * U.rand(0.96, 1.04), 1); it.rate = c.defaultRate + trend + U.randInt(-2, 2); });
            Biz.clock = at(day, 5 + k * 3, 30);
            const t = Biz.createTrip({ date: day, vehicleId: v.id, driver: v.driver, departure: ['05:30', '08:15', '11:00'][k], batchId: b.id, loadedQty: loaded, notes: '' }, items);
            const isLast = off === 0 && k === trips - 1;
            if (isLast) continue;
            Biz.clock = at(day, 9 + k * 3, 15);
            const res = Biz.completeTrip(t.id, { returnTime: ['09:45', '12:30', '15:20'][k], odometerEnd: v.odometer + U.randInt(45, 85), autoInvoice: true });
            // payments
            for (const inv of res.invoices) {
              const age2 = U.diffDays(T, inv.date), r = Math.random();
              const full = age2 > 30 ? r < 0.97 : age2 > 10 ? r < 0.86 : age2 > 3 ? r < 0.55 : r < 0.3;
              const part = !full && (age2 > 30 ? r < 0.99 : age2 > 10 ? r < 0.95 : age2 > 3 ? r < 0.78 : false);
              if (!full && !part) continue;
              const pd = U.addDays(inv.date, age2 > 3 ? U.randInt(0, 6) : 0); const pdate = pd > T ? T : pd;
              const m = U.pick(pays);
              Biz.clock = at(pdate, 12, U.randInt(0, 59));
              Biz.savePayment({ date: pdate, invoiceId: inv.id, method: m, amount: full ? inv.total : U.round(inv.total * U.rand(0.4, 0.8), 0), txnRef: m === 'UPI' ? 'UPI' + U.randInt(1e8, 9e8) : m === 'Bank Transfer' ? 'NEFT' + U.randInt(1e7, 9e7) : '' });
            }
            if (b.currentQty > 0 && b.currentQty < 60) { Biz.clock = at(day, 18); Biz.adjustStock({ batchId: b.id, date: day, type: 'Damaged', qty: b.currentQty, notes: 'Weak birds culled at batch close' }); }
            if (b.currentQty === 0) { b.status = 'Closed'; Store.save('farm_batches'); }
          }
        }
      }
      // make today's last trip partially progressed
      const open = Store.list('delivery_trips').filter(t => t.status === 'In Transit');
      open.forEach(t => { const its = Biz.tripItems(t.id); if (its[0]) its[0].status = 'Delivered'; });
      Store.save('delivery_items');
      // a draft invoice example
      Biz.clock = Date.now() - 20 * 60000;
      Biz.saveInvoice({ customerId: activeCusts[2].id, date: T, dueDate: U.addDays(T, 7), items: [{ desc: 'Dressed chicken (skinless) – bulk order', qty: 20, weight: 31.5, rate: 210, amount: 6615 }], discount: 115, charges: 150, draft: true, notes: 'Special order for function – confirm before delivery.' });
      Biz.clock = null;
      Store.markSeeded();
    } finally { Biz.clock = null; Store.commit(); }
  }
};

  card(title, body, { right = '', sub = '', cls = '', bodyCls = 'card-body' } = {}) { return `<div class="card ${cls}"><div class="card-head"><div><h4>${U.esc(title)}</h4>${sub ? `<p>${U.esc(sub)}</p>` : ''}</div><div class="flex">${right}</div></div><div class="${bodyCls}">${body}</div></div>`; },
  exportBtn(action, label = 'Export') { return `<button class="btn" data-action="${action}">${ic('export')} ${label}</button>`; }
};

/* ----------------------------- Farm management ----------------------------- */
P.farm = {
  title: 'Farm Management', group: 'Farm Operations',
  render(p) {
    const tab = p.tab || 'batches', mS = U.monthStart(), T = U.today();
    const active = Biz.activeBatches();
    const mortM = Store.list('farm_mortality').filter(m => m.date >= mS);
    const birds = U.sum(active, 'currentQty');
    const avgW = birds ? U.sum(active, b => b.currentQty * b.avgWeight) / birds : 0;
    const ss = Biz.stockSummary();
    let body = '';
    if (tab === 'batches') {
      const rows = Store.list('farm_batches').slice();
      body = Tables.render('batches', {
        rows, defaultSort: 'arrivalDate', searchPlaceholder: 'Search batch, supplier',
        search: b => b.batchId + ' ' + b.name + ' ' + b.supplier + ' ' + Biz.batchStage(b),
        columns: [
          { key: 'batchId', label: 'Batch ID', render: b => `<a class="cell-link" data-action="batch-view" data-id="${b.id}">${U.esc(b.batchId)}</a>` },
          { key: 'name', label: 'Batch Name', render: b => U.esc(b.name) },
          { key: 'arrivalDate', label: 'Arrival Date', render: b => U.date(b.arrivalDate) },
          { key: 'age', label: 'Age', sortVal: b => Biz.batchAge(b), render: b => b.status === 'Closed' ? '—' : Biz.batchAge(b) + ' days' },
          { key: 'initialQty', label: 'Initial Qty', num: true, render: b => U.int(b.initialQty) },
          { key: 'currentQty', label: 'Current Qty', num: true, render: b => `<b class="heading">${U.int(b.currentQty)}</b>` },
          { key: 'mort', label: 'Mortality', num: true, sortVal: b => ss[b.id]?.mortality || 0, render: b => { const m = ss[b.id]?.mortality || 0; return `${U.int(m)} <span class="small muted">(${(m / b.initialQty * 100).toFixed(1)}%)</span>`; } },
          { key: 'avgWeight', label: 'Avg Weight', num: true, render: b => U.dec(b.avgWeight, 2) + ' kg' },
          { key: 'supplier', label: 'Supplier', render: b => U.esc(b.supplier || '—') },
          { key: 'status', label: 'Status', sortVal: b => Biz.batchStage(b), render: b => UI.badge(Biz.batchStage(b)) },
          { key: 'a', label: '', action: true, render: b => H.more('batch-menu', b.id) }
        ]
      });
    } else if (tab === 'mortality') {
      body = Tables.render('mortality', {
        rows: Store.list('farm_mortality'), defaultSort: 'date', search: m => H.batchCode(m.batchId) + ' ' + m.cause + ' ' + m.notes,
        columns: [{ key: 'date', label: 'Date', render: m => U.date(m.date) }, { key: 'batch', label: 'Batch', sortVal: m => H.batchCode(m.batchId), render: m => `<b class="heading">${U.esc(H.batchCode(m.batchId))}</b>` }, { key: 'qty', label: 'Birds', num: true, render: m => U.int(m.qty) }, { key: 'cause', label: 'Cause', render: m => U.esc(m.cause) }, { key: 'notes', label: 'Notes', wrap: true, render: m => U.esc(m.notes || '—') }, { key: 'a', label: '', action: true, render: m => `<button class="btn btn-xs btn-outline-danger" data-action="mort-del" data-id="${m.id}">${ic('trash')} Delete</button>` }],
        footer: rows => `<td colspan="2">Total</td><td class="num">${U.int(U.sum(rows, 'qty'))}</td><td colspan="3"></td>`
      });
    } else {
      const rows = []; Store.list('farm_batches').forEach(b => (b.growth || []).forEach((g, i, arr) => rows.push({ id: b.id + i, b, date: g.date, w: g.avgWeight, prev: i ? arr[i - 1].avgWeight : null })));
      body = Tables.render('growth', {
        rows, defaultSort: 'date', search: r => r.b.batchId + ' ' + r.b.name,
        columns: [{ key: 'date', label: 'Date', render: r => U.date(r.date) }, { key: 'batch', label: 'Batch', sortVal: r => r.b.batchId, render: r => `<b class="heading">${U.esc(r.b.batchId)}</b> <span class="muted small">${U.esc(r.b.name)}</span>` }, { key: 'age', label: 'Age (days)', num: true, sortVal: r => U.diffDays(r.date, r.b.arrivalDate), render: r => U.diffDays(r.date, r.b.arrivalDate) }, { key: 'w', label: 'Avg Weight (kg)', num: true, render: r => U.dec(r.w, 3) }, { key: 'gain', label: 'Gain', num: true, sortVal: r => r.prev == null ? 0 : r.w - r.prev, render: r => r.prev == null ? '—' : `<span class="${r.w >= r.prev ? 'text-success' : 'text-danger'}">${r.w >= r.prev ? '+' : ''}${U.dec((r.w - r.prev) * 1000, 0)} g</span>` }]
      });
    }
    return `${UI.pageHead('Farm Management', `<button class="btn" data-action="weight-new">${ic('scale')} Log Weight</button><button class="btn" data-action="mort-new">${ic('alert')} Record Mortality</button><button class="btn btn-primary" data-action="batch-new">${ic('plusCircle')} New Batch</button>`, { sub: 'Batches, mortality and growth on the farm' })}
    <div class="grid g-4 mb-20">
      ${UI.stat({ label: 'Active Batches', value: U.int(active.length), icon: 'layers', color: 'primary', foot: `${active.filter(b => Biz.batchStage(b) === 'Ready for Sale').length} ready for sale · ${active.filter(b => Biz.batchStage(b) === 'Growing').length} growing` })}
      ${UI.stat({ label: 'Birds on Farm', value: U.int(birds), icon: 'feather', color: 'success', foot: `≈ ${U.int(birds * avgW)} kg live weight` })}
      ${UI.stat({ label: 'Mortality (This Month)', value: U.int(U.sum(mortM, 'qty')), icon: 'alert', color: 'danger', foot: `${mortM.length} entries since ${U.date(mS)}` })}
      ${UI.stat({ label: 'Average Live Weight', value: U.dec(avgW, 2) + ' kg', icon: 'scale', color: 'warning', foot: 'Weighted across active batches' })}
    </div>
    ${UI.tabs('tab', [['batches', 'Batches', Store.list('farm_batches').length], ['mortality', 'Mortality Records', Store.list('farm_mortality').length], ['growth', 'Growth Log']], tab)}
    ${body}`;
  }
};

P.feed = {
  title: 'Feed Management', group: 'Farm Operations',
  render(p) {
    const tab = p.tab || 'stock', mS = U.monthStart(), T = U.today();
    const fs = [...Biz.feedStock().values()];
    const purM = Store.list('feed_purchases').filter(x => x.date >= mS), conM = Store.list('feed_consumption').filter(x => x.date >= mS);
    let body;
    if (tab === 'stock') {
      const weeks = Array.from({ length: 10 }, (_, i) => U.addDays(T, -7 * (9 - i)));
      const names = fs.map(f => f.name); const pal = ['#2e7d32', '#5a9e3a', '#c8631a', '#2b8fb3', '#b5476b'];
      const series = names.map((n, k) => ({ name: n, color: pal[k % pal.length], values: weeks.map(w => U.sum(Store.list('feed_consumption').filter(c => c.feedName === n && c.date > U.addDays(w, -7) && c.date <= w), 'qty')) }));
      body = `<div class="grid g-2-1 mb-20"><div class="card"><div class="card-head"><h4>Weekly Feed Consumption</h4><div class="legend">${series.map(s => `<span><i style="background:${s.color}"></i>${U.esc(s.name)}</span>`).join('')}</div></div><div class="card-body">${Charts.bars({ labels: weeks.map(U.dateShort), series, stacked: true, track: false, height: 260, fmt: v => U.shortNum(v) + ' kg' })}</div></div>
        <div class="card"><div class="card-head"><h4>Stock Levels</h4></div><div class="card-body">${fs.map(f => { const pc = f.purchased ? f.remaining / f.purchased * 100 : 0; return `<div style="margin-bottom:16px"><div class="flex between"><b class="heading">${U.esc(f.name)}</b>${f.remaining < 1000 ? '<span class="badge b-danger">Low stock</span>' : '<span class="badge b-success">In stock</span>'}</div><div class="flex between small muted" style="margin:4px 0"><span>${U.dec(f.remaining, 0)} ${f.unit} left</span><span>of ${U.dec(f.purchased, 0)} bought</span></div><div class="progress"><i style="width:${Math.max(2, pc)}%;background:${f.remaining < 1000 ? 'var(--danger)' : 'var(--success)'}"></i></div></div>`; }).join('') || UI.empty('No feed purchased yet', '', 'sack')}</div></div></div>
        ${Tables.render('feedstock', { rows: fs.map(f => Object.assign({ id: f.name }, f)), defaultSort: 'name', noPaging: true, search: f => f.name + ' ' + f.category, columns: [{ key: 'name', label: 'Feed Name', render: f => `<b class="heading">${U.esc(f.name)}</b>` }, { key: 'category', label: 'Category' }, { key: 'purchased', label: 'Purchased', num: true, render: f => U.dec(f.purchased, 0) + ' ' + f.unit }, { key: 'consumed', label: 'Consumed', num: true, render: f => U.dec(f.consumed, 0) + ' ' + f.unit }, { key: 'remaining', label: 'Remaining Stock', num: true, render: f => `<b class="heading">${U.dec(f.remaining, 0)} ${f.unit}</b>` }, { key: 'avgRate', label: 'Avg Rate', num: true, render: f => U.money(f.avgRate) }, { key: 'val', label: 'Stock Value', num: true, sortVal: f => f.remaining * f.avgRate, render: f => U.money0(f.remaining * f.avgRate) }] })}`;
    } else if (tab === 'purchases') {
      body = Tables.render('feedpur', {
        rows: Store.list('feed_purchases').filter(x => U.inRange(x.date, p.fp_from, p.fp_to)), defaultSort: 'date', search: x => x.feedName + ' ' + x.supplier + ' ' + x.category + ' ' + x.invoiceRef,
        left: H.dateRange('fp_'),
        columns: [{ key: 'date', label: 'Purchase Date', render: x => U.date(x.date) }, { key: 'feedName', label: 'Feed Name', render: x => `<b class="heading">${U.esc(x.feedName)}</b>` }, { key: 'category', label: 'Category' }, { key: 'supplier', label: 'Supplier' }, { key: 'qty', label: 'Quantity', num: true, render: x => U.dec(x.qty, 0) + ' ' + x.unit }, { key: 'rate', label: 'Rate', num: true, render: x => U.money(x.rate) }, { key: 'total', label: 'Total Amount', num: true, render: x => `<b class="heading">${U.money(x.total)}</b>` }, { key: 'invoiceRef', label: 'Bill Ref', render: x => U.esc(x.invoiceRef || '—') }, { key: 'a', label: '', action: true, render: x => `<button class="btn btn-xs" data-action="fp-edit" data-id="${x.id}">${ic('edit')}</button> <button class="btn btn-xs btn-outline-danger" data-action="fp-del" data-id="${x.id}" aria-label="Delete">${ic('trash')}</button>` }],
        footer: rows => `<td colspan="4">Total</td><td class="num">${U.dec(U.sum(rows, 'qty'), 0)}</td><td></td><td class="num">${U.money(U.sum(rows, 'total'))}</td><td colspan="2"></td>`
      });
    } else {
      const rows = Store.list('feed_consumption').filter(x => U.inRange(x.date, p.fc_from, p.fc_to) && (!p.fc_batch || x.batchId === p.fc_batch));
      body = Tables.render('feedcon', {
        rows, defaultSort: 'date', search: x => x.feedName + ' ' + H.batchCode(x.batchId) + ' ' + x.notes,
        left: H.dateRange('fc_') + H.selFilter('fc_batch', 'All batches', Store.list('farm_batches').map(b => [b.id, b.batchId])),
        columns: [{ key: 'date', label: 'Consumption Date', render: x => U.date(x.date) }, { key: 'feedName', label: 'Feed', render: x => `<b class="heading">${U.esc(x.feedName)}</b>` }, { key: 'batch', label: 'Batch', sortVal: x => H.batchCode(x.batchId), render: x => U.esc(H.batchCode(x.batchId)) }, { key: 'qty', label: 'Consumed Quantity', num: true, render: x => U.dec(x.qty, 0) + ' ' + x.unit }, { key: 'notes', label: 'Notes', wrap: true }, { key: 'a', label: '', action: true, render: x => `<button class="btn btn-xs" data-action="fc-edit" data-id="${x.id}">${ic('edit')}</button> <button class="btn btn-xs btn-outline-danger" data-action="fc-del" data-id="${x.id}" aria-label="Delete">${ic('trash')}</button>` }],
        footer: r => `<td colspan="3">Total</td><td class="num">${U.dec(U.sum(r, 'qty'), 0)} kg</td><td colspan="2"></td>`
      });
    }
    return `${UI.pageHead('Feed Management', `<button class="btn" data-action="fc-new">${ic('sack')} Record Consumption</button><button class="btn btn-primary" data-action="fp-new">${ic('plusCircle')} New Purchase</button>`, { sub: 'Feed purchases, daily consumption and remaining stock' })}
    <div class="grid g-4 mb-20">
      ${UI.stat({ label: 'Feed in Stock', value: U.int(U.sum(fs, 'remaining')) + ' kg', icon: 'sack', color: 'primary', foot: `${fs.filter(f => f.remaining < 1000).length} feed types running low` })}
      ${UI.stat({ label: 'Purchased (This Month)', value: U.money0(U.sum(purM, 'total')), icon: 'card', color: 'success', foot: `${U.int(U.sum(purM, 'qty'))} kg in ${purM.length} purchases` })}
      ${UI.stat({ label: 'Consumed (This Month)', value: U.int(U.sum(conM, 'qty')) + ' kg', icon: 'activity', color: 'warning', foot: `${conM.length} consumption entries` })}
      ${UI.stat({ label: 'Stock Value', value: U.money0(U.sum(fs, f => f.remaining * f.avgRate)), icon: 'rupee', color: 'info', foot: 'At average purchase rate' })}
    </div>
    ${UI.tabs('tab', [['stock', 'Stock Report'], ['purchases', 'Purchase History', Store.list('feed_purchases').length], ['consumption', 'Daily Consumption', Store.list('feed_consumption').length]], tab)}${body}`;
  }
};

F.feedPurchase = id => {
  const x = id ? Store.get('feed_purchases', id) : null;
  const names = [...Biz.feedStock().keys()];
  const m = UI.modal({
    title: x ? 'Edit Feed Purchase' : 'New Feed Purchase', submitText: x ? 'Save changes' : 'Add purchase',
    body: `<datalist id="feedNames">${names.map(n => `<option value="${U.esc(n)}">`).join('')}</datalist>` + UI.fields([
      { name: 'feedName', label: 'Feed Name', required: true, value: x?.feedName || '', list: 'feedNames' }, { name: 'category', label: 'Feed Category', type: 'select', options: FEED_CATEGORIES, value: x?.category || '' },
      { name: 'supplier', label: 'Supplier', value: x?.supplier || '' }, { name: 'date', label: 'Purchase Date', type: 'date', required: true, value: x?.date || U.today() },
      { name: 'qty', label: 'Quantity', type: 'number', required: true, value: x?.qty || '' }, { name: 'unit', label: 'Unit', type: 'select', placeholder: false, options: ['kg', 'bag (50 kg)', 'tonne'], value: x?.unit || 'kg' },
      { name: 'rate', label: 'Rate per Unit (₹)', type: 'number', step: '0.01', required: true, value: x?.rate || '' }, { name: 'total', label: 'Total Amount', readonly: true, value: x ? U.money(x.total) : U.money(0) },
      { name: 'invoiceRef', label: 'Supplier Bill No.', value: x?.invoiceRef || '' }, { name: 'paymentMode', label: 'Paid By', type: 'select', placeholder: false, options: PAY_METHODS, value: 'Bank Transfer' }
    ]),
    onSubmit: d => { Biz.saveFeedPurchase(d, id); UI.toast(x ? 'Purchase updated' : 'Feed purchase added'); App.refresh(); }
  });
  const upd = () => { m.form.total.value = U.money(U.num(m.form.qty.value) * U.num(m.form.rate.value)); };
  m.form.qty.addEventListener('input', upd); m.form.rate.addEventListener('input', upd);
  m.form.feedName.addEventListener('change', () => { const f = Biz.feedStock().get(m.form.feedName.value); if (f) { if (!m.form.category.value) m.form.category.value = f.category; if (!m.form.rate.value) { m.form.rate.value = U.round(f.avgRate); upd(); } } });

F.consumption = id => {
  const x = id ? Store.get('feed_consumption', id) : null;
  const fs = [...Biz.feedStock().values()];

P.statements = {
  title: 'Customer Statements', group: 'Distribution',
  ledger(custId, from, to) {
    const cs = custId ? [Biz.customer(custId)].filter(Boolean) : Store.list('customers');
    const out = [];
    for (const c of cs) {
      const tx = [];
      Store.list('invoices').filter(i => i.customerId === c.id && !i.cancelled && !i.draft).forEach(i => tx.push({ date: i.date, ord: 0, type: 'Invoice', ref: i.number, refId: i.id, debit: i.total, credit: 0 }));
      Store.list('payments').filter(x => x.customerId === c.id).forEach(x => tx.push({ date: x.date, ord: 1, type: 'Payment', ref: x.receiptNo + (Biz.invoice(x.invoiceId) ? ' · ' + Biz.invoice(x.invoiceId).number : ''), refId: x.invoiceId, debit: 0, credit: x.amount, method: x.method }));
      tx.sort((a, b) => a.date.localeCompare(b.date) || a.ord - b.ord);
      let bal = U.num(c.openingBalance);
      if (bal) out.push({ id: c.id + 'ob', c, date: c.since || '', type: 'Opening', ref: 'Opening balance', opening: 0, debit: bal, credit: 0, closing: bal, seq: 0, _show: !from || (c.since || '') >= from });
      tx.forEach((t, k) => { const o = bal; bal = U.round(bal + t.debit - t.credit); out.push(Object.assign({ id: c.id + k, c, opening: o, closing: bal, seq: k + 1, _show: U.inRange(t.date, from, to) }, t)); });
    }
    return out.filter(r => r._show && U.inRange(r.date, from, to));
  },
  ledgerTable(custId, from, to, id, left, type) {
    const rows = P.statements.ledger(custId, from, to).filter(r => !type || r.type === type);
    return Tables.render(id, {
      rows, defaultSort: 'date', left, search: r => r.c.shopName + ' ' + r.ref + ' ' + r.type,
      columns: [{ key: 'date', label: 'Date', sortVal: r => r.date + String(r.seq).padStart(6, '0'), render: r => U.date(r.date) }].concat(custId ? [] : [{ key: 'cust', label: 'Customer', sortVal: r => r.c.shopName, render: r => H.custCell(r.c) }]).concat([
        { key: 'ref', label: 'Reference', render: r => r.type === 'Invoice' ? `<a class="cell-link" data-action="open-invoice" data-id="${r.refId}">${U.esc(r.ref)}</a>` : `<span class="muted">${U.esc(r.ref)}</span>` },
        { key: 'type', label: 'Type', render: r => UI.badge(r.type) }, { key: 'opening', label: 'Opening Balance', num: true, render: r => U.money(r.opening) }, { key: 'debit', label: 'Invoiced', num: true, render: r => r.debit ? U.money(r.debit) : '—' }, { key: 'credit', label: 'Total Payment', num: true, render: r => r.credit ? U.money(r.credit) : '—' }, { key: 'closing', label: 'Closing Balance', num: true, render: r => `<b class="heading">${U.money(r.closing)}</b>` }]),
      footer: r => `<td colspan="${custId ? 4 : 5}">Period total</td><td class="num">${U.money(U.sum(r, 'debit'))}</td><td class="num">${U.money(U.sum(r, 'credit'))}</td><td></td>`
    });
  },
  render(p) {
    const cust = p.s_cust || '', from = p.s_from || U.addDays(U.today(), -30), to = p.s_to || U.today(), type = p.s_type || '';
    const rows = P.statements.ledger(cust, from, to);
    const inv = U.sum(rows, 'debit'), pay = U.sum(rows, 'credit');
    const agg = Biz.custAgg();
    const outstanding = cust ? agg.get(cust)?.outstanding || 0 : Biz.outstanding();
    return `${UI.pageHead('Customer Statements', `<button class="btn" data-action="stmt-print">${ic('printer')} Print</button>`, { sub: 'Running balance of invoices and payments per shop' })}
    <div class="grid g-4 mb-20">${UI.stat2({ label: 'Total Invoiced', value: U.money(inv), icon: 'file', color: 'primary' })}${UI.stat2({ label: 'Total Payments', value: U.money(pay), icon: 'wallet', color: 'orange' })}${UI.stat2({ label: 'Outstanding', value: U.money(outstanding), icon: 'hourglass', color: 'danger' })}${UI.stat2({ label: 'Net for Period', value: U.money(inv - pay), icon: 'layers', color: 'info' })}</div>
    <div class="card mb-20"><div class="card-head bordered"><h4 class="flex">${ic('filter')} Filter</h4><span class="muted">Showing ${rows.filter(r => !type || r.type === type).length} transactions</span></div>
      <form class="card-body" id="stmtForm"><div class="form-grid" style="grid-template-columns:repeat(3,minmax(0,1fr)) auto;align-items:end">
        ${UI.field({ name: 's_cust', label: 'Customers', type: 'select', placeholder: 'All customers', options: Store.list('customers').map(c => [c.id, c.shopName]), value: cust })}
        ${UI.field({ name: 's_type', label: 'Transaction Type', type: 'select', placeholder: 'All types', options: ['Invoice', 'Payment', 'Opening'], value: type })}
        <div class="fg"><label>Date Range</label><div class="flex"><input class="fc" type="date" name="s_from" value="${from}" aria-label="From"><input class="fc" type="date" name="s_to" value="${to}" aria-label="To"></div></div>
        <button type="button" class="btn btn-primary" style="height:42px;min-width:150px" data-action="stmt-gen">Generate</button></div></form></div>
    <div id="stmtTable">${P.statements.ledgerTable(cust, from, to, 'stmt', '', type)}</div>`;
  }
};

A['stmt-print'] = () => UI.print(U.$('#stmtTable'), 'Customer Statement' + (App.params.s_cust ? ' – ' + Biz.customer(App.params.s_cust).shopName : '') + ` (${U.date(App.params.s_from || U.addDays(U.today(), -30))} – ${U.date(App.params.s_to || U.today())})`);
